<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Javier Hernández Quinto | Especialista en Infiltraciones de PRP</title>
    <meta name="description" content="Traumatólogo especialista en Medicina Deportiva y Regenerativa. Infiltraciones de Plasma Rico en Plaquetas (PRP) en Murcia, Torrevieja y Pilar de la Horadada.">
    
    <!-- Fuentes modernas -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        :root {
            --primary: #0f2c59;       /* Azul marino profundo premium */
            --accent: #00b4d8;        /* Azul médico brillante */
            --dark: #1e293b;          /* Gris pizarra oscuro para texto */
            --light: #f8fafc;         /* Fondo gris claro limpio */
            --white: #ffffff;
            --whatsapp: #25D366;      /* Verde WhatsApp */
            --shadow: 0 10px 30px rgba(15, 44, 89, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--dark);
            line-height: 1.7;
            background-color: var(--white);
            background-image: radial-gradient(rgba(0, 180, 216, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        h1, h2, h3 {
            font-family: 'Lexend', sans-serif;
            color: var(--primary);
            font-weight: 700;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 0;
        }

        /* --- BOTONES MODERNOS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--primary);
            color: var(--white);
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(15, 44, 89, 0.15);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(15, 44, 89, 0.25);
            background-color: #0a1f40;
        }

        .btn-ws {
            background-color: var(--whatsapp);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }

        .btn-ws:hover {
            background-color: #1ebd54;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
            transform: translateY(-3px);
        }

        /* --- CABECERA --- */
        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.02);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Lexend', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        .logo span { color: var(--accent); }

        /* --- HERO PRINCIPAL --- */
        .hero {
            background: linear-gradient(135deg, #0f2c59 0%, #07142b 100%);
            color: var(--white);
            padding: 120px 0 160px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            height: 100px;
            background: var(--white);
            transform: skewY(-2deg);
        }

        .hero h1 {
            color: var(--white);
            font-size: 3rem;
            line-height: 1.2;
            max-width: 850px;
            margin: 0 auto 24px auto;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 650px;
            margin: 0 auto 40px auto;
            color: #cbd5e1;
        }

        .badge-med {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 180, 216, 0.15);
            border: 1px solid rgba(0, 180, 216, 0.3);
            color: #90e0ef;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- TARJETA DEL DOCTOR --- */
        .doctor-profile {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 50px;
            background-color: var(--white);
            border-radius: 24px;
            padding: 50px;
            margin-top: -100px;
            box-shadow: 0 20px 40px rgba(15, 44, 89, 0.08);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(15, 44, 89, 0.04);
        }

        .doc-img-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }

        .doc-img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .doc-info h2 { font-size: 2.2rem; margin-bottom: 8px; }
        .doc-subtitle { color: var(--accent); font-weight: 600; font-size: 1.1rem; margin-bottom: 16px; }
        .doc-meta { font-size: 0.9rem; color: #64748b; background-color: var(--light); display: inline-block; padding: 4px 12px; border-radius: 6px; margin-bottom: 24px; }
        
        /* Hospitales y Ciudades */
        .doc-locations-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
        }

        .loc-block h4 { font-family: 'Lexend', sans-serif; font-size: 1.05rem; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px;}
        .loc-block ul { list-style: none; }
        .loc-block li { font-size: 0.95rem; color: #475569; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
        .loc-block li i { color: var(--accent); margin-top: 5px; font-size: 0.85rem; }

        /* --- SECCIÓN ZONAS DE INFILTRACIÓN (NUEVA) --- */
        .section-title {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.2rem;
        }
        .section-title span { color: var(--accent); }

        .grid-treatments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .treat-card {
            background-color: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .treat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(15, 44, 89, 0.1);
        }

        .treat-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .treat-content { padding: 24px; }
        .treat-content h3 { font-size: 1.3rem; margin-bottom: 10px; }
        .treat-content p { color: #475569; font-size: 0.95rem; }

        /* --- SECCIÓN BENEFICIOS BIOLÓGICOS --- */
        .bg-light { background-color: var(--light); }
        
        .grid-benefits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .benefit-card {
            background-color: var(--white);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(15, 44, 89, 0.02);
            text-align: center;
        }

        .benefit-card .icon-wrapper {
            width: 70px;
            height: 70px;
            background-color: rgba(0, 180, 216, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .benefit-card i { font-size: 2rem; color: var(--accent); }
        .benefit-card h3 { font-size: 1.25rem; margin-bottom: 12px; }
        .benefit-card p { color: #64748b; font-size: 0.95rem; }

        /* --- CAJA DE LLAMADA A LA ACCIÓN --- */
        .cta-box {
            background: linear-gradient(135deg, #0f2c59 0%, #1e3d59 100%);
            color: var(--white);
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(15, 44, 89, 0.2);
        }
        .cta-box h2 { color: var(--white); font-size: 2.2rem; margin-bottom: 16px; }
        .cta-box p { max-width: 600px; margin: 0 auto 32px auto; color: #e2e8f0; font-size: 1.1rem; }

        /* --- PIE DE PÁGINA --- */
        footer {
            background-color: #0b132b;
